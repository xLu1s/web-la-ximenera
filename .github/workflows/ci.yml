name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Nunca se llama a Resend real: los tests levantan un servidor que lo simula.
      RESEND_API_KEY: re_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 exige Node >= 22.23.4 (la 22 preinstalada del runner puede ser anterior).
          node-version: '22.23.4'
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # Stack local (Docker) con las migraciones de supabase/migrations.
      # Los tests usan las claves de demostración del stack local.
      - run: supabase start
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tests unitarios e integración (Vitest)
        run: npm test
      - name: Tests E2E (Playwright)
        run: npm run test:e2e
      - name: Prueba real de backup y restauración (stack local + S3 simulado)
        env:
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: |
          # pg_dump debe ser >= la versión del servidor (Postgres 17).
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          pipx install 'moto[server]'
          npm run test:backup
      - name: Informe de Playwright (solo datos de prueba)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
